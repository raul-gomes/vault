[project]
name = "envvault"
version = "0.1.0"
description = "Local encrypted vault that injects project .env secrets into subprocesses without exposing them."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Raul Gomes" }]
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "cryptography>=43,<50",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "rich>=13,<15",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
envvault = "envvault.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/envvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.coverage.run]
source = ["envvault"]
omit = ["src/envvault/migrations/*"]
